<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tote Inventory v2</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:16px;position:sticky;top:0;z-index:5}
h1{margin:0 0 12px;font-size:23px}.bar{display:flex;gap:8px;flex-wrap:wrap}
button,.file{padding:11px 14px;border:0;border-radius:10px;font-size:16px;font-weight:600;background:white}
main{max-width:760px;margin:auto;padding:14px}.search{display:flex;gap:8px}.search input{flex:1}
input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:white}
textarea{min-height:90px}label{font-weight:700;display:block;margin:10px 0 5px}
.card{background:white;padding:16px;margin:12px 0;border-radius:16px;box-shadow:0 1px 5px #0001}
.card h2{margin:0 0 3px}.muted{color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:#16a34a;color:white}
.photo{max-width:180px;max-height:180px;border-radius:10px;margin-top:8px}.status{color:#166534;margin-top:8px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header><h1>📦 Tote Inventory v2</h1><div class="bar">
<button onclick="showAll()">All Totes</button><button onclick="newTote()">New Tote</button>
<button onclick="backup()">Backup</button><label class="file">Restore<input hidden type="file" accept=".json" onchange="restore(event)"></label>
</div></header><main>
<div class="search"><input id="search" placeholder="Search tote, item, category..." oninput="render()"><button onclick="clearSearch()">Clear</button></div>
<div id="list"></div></main>
<script>
const KEY="toteInventoryV2";
let totes=JSON.parse(localStorage.getItem(KEY)||"null")||Array.from({length:20},(_,i)=>({id:"T-"+String(i+1).padStart(3,"0"),rack:"Rack A",position:i+1,category:"",contents:"",quantity:"",condition:"Good",notes:"",photo:""}));
function save(){localStorage.setItem(KEY,JSON.stringify(totes))}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
 let q=document.getElementById("search").value.toLowerCase(), p=new URLSearchParams(location.search).get("tote");
 let a=totes.filter(x=>(!p||x.id.toLowerCase()==p.toLowerCase())&&(!q||JSON.stringify(x).toLowerCase().includes(q)));
 document.getElementById("list").innerHTML=a.map(card).join("")||"<div class=card>No totes found.</div>";
}
function card(x){return `<section class="card" id="${x.id}"><h2>${x.id}</h2><div class=muted>${x.rack} · Position ${x.position}</div>
<div class=grid><div><label>Category</label><input data-id="${x.id}" data-k=category value="${esc(x.category)}"></div>
<div><label>Quantity</label><input data-id="${x.id}" data-k=quantity value="${esc(x.quantity)}"></div>
<div class=full><label>Contents / Items</label><textarea data-id="${x.id}" data-k=contents placeholder="Christmas lights, extension cords...">${esc(x.contents)}</textarea></div>
<div><label>Condition</label><select data-id="${x.id}" data-k=condition>${["Good","Fair","Poor","Needs repair"].map(v=>`<option ${x.condition==v?"selected":""}>${v}</option>`).join("")}</select></div>
<div><label>Photo</label><input type=file accept="image/*" capture=environment onchange="photo(event,'${x.id}')">${x.photo?`<img class=photo src="${x.photo}">`:""}</div>
<div class=full><label>Notes</label><textarea data-id="${x.id}" data-k=notes>${esc(x.notes)}</textarea></div></div>
<div class=actions><button class=primary onclick="saveTote('${x.id}')">Save ${x.id}</button><button onclick="copyId('${x.id}')">Copy ID</button><button onclick="qr('${x.id}')">QR Link</button><button onclick="share('${x.id}')">Share</button></div><div class=status id="s-${x.id}"></div></section>`}
function saveTote(id){let x=totes.find(t=>t.id==id);document.querySelectorAll('[data-id="'+id+'"]').forEach(e=>x[e.dataset.k]=e.value);save();document.getElementById("s-"+id).textContent="Saved ✓"}
function copyId(id){navigator.clipboard?.writeText(id)}
function qr(id){let u=location.origin+location.pathname+"?tote="+id;navigator.clipboard?.writeText(u);alert("QR/link for "+id+"\n\n"+u)}
async function share(id){let u=location.origin+location.pathname+"?tote="+id;if(navigator.share)await navigator.share({title:id,url:u});else navigator.clipboard?.writeText(u)}
function photo(e,id){let r=new FileReader();r.onload=()=>{totes.find(t=>t.id==id).photo=r.result;save();render()};r.readAsDataURL(e.target.files[0])}
function backup(){save();let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(totes,null,2)],{type:"application/json"}));a.download="tote-inventory-backup.json";a.click()}
function restore(e){let r=new FileReader();r.onload=()=>{try{totes=JSON.parse(r.result);save();render()}catch(_){alert("Invalid backup")}};r.readAsText(e.target.files[0])}
function newTote(){let n=totes.length+1;totes.push({id:"T-"+String(n).padStart(3,"0"),rack:"Rack A",position:n,category:"",contents:"",quantity:"",condition:"Good",notes:"",photo:""});save();render()}
function showAll(){history.replaceState(null,"",location.pathname);render()}function clearSearch(){document.getElementById("search").value="";render()}
render();
</script></body></html>
