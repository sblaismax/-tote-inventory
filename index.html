<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tote Inventory v4</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:15px;position:sticky;top:0;z-index:5}h1{font-size:23px;margin:0 0 10px}.bar,.actions{display:flex;gap:8px;flex-wrap:wrap}button,label.file{border:0;border-radius:10px;padding:11px 13px;font:inherit;font-weight:650;background:#fff;color:#111827}button.primary{background:#16a34a;color:#fff}main{max-width:780px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 6px #0001}.muted{color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-weight:700;display:block;margin:9px 0 5px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:#fff}textarea{min-height:90px}.photo{max-width:190px;max-height:190px;border-radius:10px;margin-top:8px}.status{color:#166534;margin-top:8px}.notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px;margin-bottom:12px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:999px;display:none}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body>
<header><h1>📦 Tote Inventory v4</h1><div class="bar"><input id="search" placeholder="Search tote, item, category..." oninput="render()"><button onclick="showAll()">All Totes</button><button onclick="scan()">📷 Scan QR</button></div><div id="scanner" style="display:none;background:#222;padding:10px"><div id="reader"></div><button onclick="stopScan()">Close</button></div></header>
<main><div class="card"><div class="actions"><button class="primary" onclick="backup()">⬇️ Backup</button><label class="file">⬆️ Restore<input hidden type="file" accept=".json" onchange="restore(event)"></label><button onclick="addTote()">➕ New Tote</button></div><div class="muted">V4 uses IndexedDB for persistent local storage. Backup regularly.</div></div><div id="app"></div></main><div id="toast"></div>
<script src="https://unpkg.com/html5-qrcode" defer></script><script>
const DB="ToteInventoryV4",STORE="totes";let db,scanner;
const def=n=>({id:"T-"+String(n).padStart(3,"0"),rack:"Rack A",position:n,category:"",contents:"",quantity:"",condition:"Good",notes:"",photo:""});
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:"id"});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function req(method,t){return new Promise((ok,no)=>{let r=db.transaction(STORE,method).objectStore(STORE)[t[0]](...t.slice(1));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
const all=()=>req("readonly",["getAll"]),get=id=>req("readonly",["get",id]),put=x=>req("readwrite",["put",x]),del=id=>req("readwrite",["delete",id]);
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function init(){await openDB();if(!(await all()).length){for(let i=1;i<=20;i++)await put(def(i))}route()}
function route(){let id=new URLSearchParams(location.search).get("tote");id?get(id.toUpperCase()).then(x=>x?openTote(x):render()):render()}
async function render(){let q=document.getElementById("search").value.toLowerCase(),a=await all();a.sort((x,y)=>x.id.localeCompare(y.id,undefined,{numeric:true}));a=a.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));document.getElementById("app").innerHTML=a.map(card).join("")}
function card(x){return `<section class=card><h2>${x.id}</h2><div class=muted>${x.rack} · Position ${x.position}</div><div class=grid><div><label>Category</label><input id="${x.id}c" value="${esc(x.category)}"></div><div><label>Quantity</label><input id="${x.id}q" value="${esc(x.quantity)}"></div><div class=full><label>Contents / Items</label><textarea id="${x.id}i">${esc(x.contents)}</textarea></div><div><label>Condition</label><select id="${x.id}d">${["Good","Fair","Poor","Needs repair"].map(v=>`<option ${v==x.condition?"selected":""}>${v}</option>`).join("")}</select></div><div><label>Photo</label><input type=file accept="image/*" capture=environment onchange="photo(event,'${x.id}')">${x.photo?`<img class=photo src="${x.photo}">`:''}</div><div class=full><label>Notes</label><textarea id="${x.id}n">${esc(x.notes)}</textarea></div></div><div class=actions><button class=primary onclick="saveTote('${x.id}')">💾 Save</button><button onclick="openToteById('${x.id}')">Open</button><button onclick="copyLink('${x.id}')">Copy QR Link</button></div><div class=status id="s${x.id}"></div></section>`}
async function saveTote(id){let x=await get(id);x.category=document.getElementById(id+"c").value;x.quantity=document.getElementById(id+"q").value;x.contents=document.getElementById(id+"i").value;x.condition=document.getElementById(id+"d").value;x.notes=document.getElementById(id+"n").value;await put(x);document.getElementById("s"+id).textContent="Saved ✓";toast(id+" saved")}
async function openToteById(id){let x=await get(id);if(x)openTote(x)}
function openTote(x){history.replaceState(null,"",location.pathname+"?tote="+x.id);document.getElementById("search").value="";document.getElementById("app").innerHTML=card(x).replace(/<button class=primary[^>]*>.*?<\/button>/,"<button class=primary onclick=\"saveTote('"+x.id+"')\">💾 Save</button>")+"<div class=card><button onclick=\"showAll()\">← All Totes</button></div>"}
function showAll(){history.replaceState(null,"",location.pathname);document.getElementById("search").value="";render()}
async function addTote(){let a=await all(),n=a.reduce((m,x)=>Math.max(m,parseInt(x.id.replace(/\D/g,""))||0),0)+1,x=def(n);await put(x);openTote(x)}
async function photo(e,id){let f=e.target.files[0],r=new FileReader();r.onload=async()=>{let x=await get(id);x.photo=r.result;await put(x);openTote(x)};r.readAsDataURL(f)}
function copyLink(id){let u=location.origin+location.pathname+"?tote="+id;navigator.clipboard?.writeText(u);toast("QR link copied")}
async function backup(){let a=await all(),b=new Blob([JSON.stringify({version:4,totes:a},null,2)],{type:"application/json"}),x=document.createElement("a");x.href=URL.createObjectURL(b);x.download="tote-inventory-v4-backup.json";x.click()}
function restore(e){let r=new FileReader();r.onload=async()=>{try{let x=JSON.parse(r.result),a=x.totes||x;if(!Array.isArray(a))throw 0;for(let t of a)await put(t);render();toast("Backup restored")}catch(_){alert("Invalid backup")}};r.readAsText(e.target.files[0])}
function toast(s){let x=document.getElementById("toast");x.textContent=s;x.style.display="block";setTimeout(()=>x.style.display="none",1600)}
async function scan(){let b=document.getElementById("scanner");b.style.display="block";if(typeof Html5Qrcode==="undefined"){document.getElementById("reader").innerHTML="<p>Scanner loading. Try again.</p>";return}scanner=new Html5Qrcode("reader");scanner.start({facingMode:"environment"},{fps:10,qrbox:250},async id=>{let x=await get(id.trim().toUpperCase());if(x){stopScan();openTote(x)}else{stopScan();alert("Tote not found: "+id)}}).catch(()=>alert("Camera access unavailable"))}
function stopScan(){if(scanner){scanner.stop().catch(()=>{});scanner=null}document.getElementById("scanner").style.display="none"}
init().catch(()=>document.getElementById("app").innerHTML="<div class=card><b>IndexedDB could not be opened.</b></div>");
</script></body></html>
